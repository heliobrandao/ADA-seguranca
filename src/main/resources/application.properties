spring.application.name=projeto-fundamentos-seguranca-ada

spring.jpa.open-in-view=false

# Banco H2 
spring.datasource.url=jdbc:h2:file:./data/seguranca
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Mostrar o SQL no console
spring.jpa.show-sql=true
# Criar ou atualizar o banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=update
server.port=8888

# Configurações de JWT
security.jwt.secret=${JWT_KEY}
security.jwt.issuer=helpdesk
security.jwt.expiration=PT1H
